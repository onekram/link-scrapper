app:
  telegram-token: ${TELEGRAM_TOKEN}
  scrapper-url: ${SCRAPPER_URL}
  telegram-url: "https://api.telegram.org"

spring:
  liquibase:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
