app:
  telegram-token: ${TELEGRAM_TOKEN} # env variable
  scrapper-url: "http://localhost:8081"
  telegram-url: "https://api.telegram.org"

features:
  webhook:
    enabled: false

logging:
  level:
    root: info

spring:
  application:
    name: Bot
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
