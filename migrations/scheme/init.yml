databaseChangeLog:
  - changeSet:
      id: init-user
      author: Ivan Kramarenko
      changes:
        - createSchema:
            schemaName: user
        - createTable:
            schemaName: user
            tableName: station
            columns:
              - column:
                  name: id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
