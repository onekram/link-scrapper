app:
  github-token: gh_mock_token
  stackoverflow:
    key: so_token_key
    access-token: so_access_token
  github-api-url: ${wiremock.url}
  bot-url: ${wiremock.url}
  fixed-rate-scheduling: 1000
  stack-overflow-api-url: ${wiremock.url}

wiremock:
  url: "http://localhost:8083"

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/scrapper
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: true
    change-log: file:../migrations/master.yml

springdoc:
  swagger-ui:
    enabled: false
    path: /swagger-ui
